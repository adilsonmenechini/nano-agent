<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NanoAgent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient-background"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">NanoAgent</h1>
        <button id="new-session-btn" class="btn-icon" title="New Session (Ctrl+N)">+</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav">
        <a href="#" data-panel="chat">
          <span>💬</span> Chat
        </a>
        <a href="#" data-panel="sessions">
          <span>📋</span> Sessions
        </a>
        <a href="#" class="active" data-panel="skills">
          <span>🧩</span> Skills
        </a>
      </nav>
      <div id="sessions-panel" class="sidebar-panel">
        <div class="panel-search">
          <input type="search" class="search-input" data-target="sessions" placeholder="Search sessions…" autocomplete="off">
        </div>
        <div id="session-list"></div>
      </div>
      <div id="skills-panel" class="sidebar-panel active">
        <div class="panel-search">
          <input type="search" class="search-input" data-target="skills" placeholder="Search skills…" autocomplete="off">
        </div>
        <div id="skill-list"></div>
      </div>
    </aside>
    <main id="main">
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="indicator" class="hidden" role="status" aria-live="polite">
          <span class="indicator-dot"></span>
          <span id="indicator-text">Thinking…</span>
        </div>
        <div id="input-area">
          <div class="input-wrapper">
            <textarea id="chat-input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" enterkeyhint="send"></textarea>
            <div class="input-actions">
              <button id="send-btn" class="btn-primary" disabled>Send</button>
              <button id="cancel-btn" class="btn-secondary hidden">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/bridge.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/sessions.js"></script>
  <script src="/js/skills.js"></script>
  <script src="/js/commands.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
