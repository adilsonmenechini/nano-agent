[project]
name = "nanoagent"
version = "0.1.0"
description = "A lightweight agent with memory, tools, skills, and LLM provider support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "mcp>=1.0.0",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "ddgs>=9.14.4",
    "readability-lxml>=0.8.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.0",
    "pyright>=1.1.0",
    "vulture>=2.15",
]

[project.scripts]
nanoagent = "nanoagent.cli:cli"
